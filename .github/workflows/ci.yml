name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: fmt / vet / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Падаем, если есть неотформатированные файлы (и показываем какие).
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Не отформатированы (gofmt):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go test
        run: go test -race ./...

  frontend:
    name: frontend lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: visual/frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: visual/frontend/pnpm-lock.yaml

      - name: install
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: vitest
        run: pnpm test

      - name: build (tsc + vite)
        run: pnpm build
