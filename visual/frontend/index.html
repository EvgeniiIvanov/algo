<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Визуализатор алгоритмов</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <h1>Визуализатор алгоритмов</h1>
      <p class="lead">
        Откройте эту страницу и бэкенд на <code>:8080</code>, введите данные и наблюдайте выполнение в плеере.
      </p>
      <section id="controls">
        <label>
          Алгоритм
          <select id="algorithm">
            <option value="binary-search">Бинарный поиск</option>
            <option value="stack">Стек</option>
            <option value="queue">Очередь</option>
            <option value="list">Список</option>
            <option value="linked-list">Связный список</option>
            <option value="hash-table">Хеш-таблица</option>
            <option value="bubble-sort">Сортировка пузырьком</option>
            <option value="selection-sort">Сортировка выбором</option>
            <option value="insertion-sort">Сортировка вставками</option>
          </select>
        </label>
        <div id="binary-search-inputs" class="inputs">
          <label>
            Массив (через запятую)
            <input id="values" type="text" value="1,3,5,7,9,11,13" />
          </label>
          <label>
            Искомое значение
            <input id="target" type="text" value="7" />
          </label>
        </div>
        <div id="stack-inputs" class="inputs" hidden>
          <label>
            Ёмкость стека
            <input id="capacity" type="text" value="3" />
          </label>
          <label>
            Сценарий операций (по одной на строку)
            <textarea id="script" rows="6">push 5
push 7
pop
push 9
push 11
push 13</textarea>
          </label>
        </div>
        <div id="queue-inputs" class="inputs" hidden>
          <label>
            Ёмкость очереди
            <input id="queue-capacity" type="text" value="3" />
          </label>
          <label>
            Сценарий операций (по одной на строку)
            <textarea id="queue-script" rows="6">enqueue 5
enqueue 7
dequeue
enqueue 9
enqueue 11
enqueue 13</textarea>
          </label>
        </div>
        <div id="list-inputs" class="inputs" hidden>
          <label>
            Сценарий операций (по одной на строку)
            <textarea id="list-script" rows="6">insert 0 5
insert 0 3
insert 1 9
insert 3 7
remove 1</textarea>
          </label>
        </div>
        <div id="linked-list-inputs" class="inputs" hidden>
          <label>
            Сценарий операций (по одной на строку)
            <textarea id="linked-list-script" rows="6">prepend 4
append 7
insert 1 9
remove 0
find 7</textarea>
          </label>
        </div>
        <div id="hash-table-inputs" class="inputs" hidden>
          <label>
            Число корзин
            <input id="hash-table-buckets" type="text" value="5" />
          </label>
          <label>
            Сценарий операций (по одной на строку)
            <textarea id="hash-table-script" rows="6">put 1 10
put 6 20
get 1
get 9
delete 6
delete 9</textarea>
          </label>
        </div>
        <div id="sort-inputs" class="inputs" hidden>
          <label>
            Массив (через запятую)
            <input id="sort-values" type="text" value="3,1,2" />
          </label>
        </div>
        <button id="run" type="button">Запустить</button>
      </section>
      <section id="player" hidden>
        <div class="player-buttons">
          <button id="step-back" type="button">⟸ Шаг назад</button>
          <button id="play-pause" type="button">▶ Старт</button>
          <button id="step-forward" type="button">Шаг вперёд ⟹</button>
        </div>
        <label class="speed">
          Скорость
          <input id="speed" type="range" min="1" max="8" step="1" value="2" />
          <span id="speed-label">2×</span>
        </label>
        <label class="seek">
          Кадр
          <input id="seek" type="range" min="1" step="1" value="1" />
          <span id="frame-label">— / —</span>
        </label>
      </section>
      <section id="frame-view">
        <div id="explanation" class="explanation">Нажмите «Запустить», чтобы получить кадры.</div>
        <div id="array" class="array" aria-label="Снимок массива"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
